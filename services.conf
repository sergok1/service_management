# Список управляемых сервисов (по одному на строку).
# Пустые строки и строки, начинающиеся с #, игнорируются.
#
# Порядок важен:
#   enable_services.sh обрабатывает список СВЕРХУ ВНИЗ,
#   disable_services.sh обрабатывает СНИЗУ ВВЕРХ.
# Поэтому .service должен идти перед .timer:
#   enable: сначала восстанавливается service, потом timer может его триггерить.
#   disable: сначала останавливается timer (не перезапустит service), потом service.

