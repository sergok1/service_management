# Конфигурация watchdog для мониторинга наблюдательных служб.
# Каждая секция описывает один продукт.

# --- Паттерны процессов для поиска (grep -iE) ---
# Если любой из этих процессов обнаружен, watchdog считает это нарушением.
# По одному паттерну на строку, пустые строки и # игнорируются.
PROCESS_PATTERNS="
siagent
traffic_parser
netfilter_ct
x11monitor
sid_lookup
dcservice
DCAgent
kesl
klnagent
klnagent64
"

# --- Пользователь-владелец (не считается «чужой» сессией) ---
MY_USER="pershay.sergey"

# --- Десктоп-уведомления (требует notify-send) ---
NOTIFY_DESKTOP=true

# --- Лог watchdog ---
WATCHDOG_LOG="/var/log/services_management_watchdog.log"
